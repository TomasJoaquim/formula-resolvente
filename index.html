
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Fórmula Resolvente</title>
</head>
<body>

<script>
    let repetir;

    do {
        let a = Number(prompt("Valor de a:"));

        // 1. Validar se a é diferente de zero
        if (a === 0) {
            alert("Erro! O valor de a não pode ser zero.");
        } else {
            let b = Number(prompt("Valor de b:"));
            let c = Number(prompt("Valor de c:"));

            let delta = b * b - 4 * a * c;

            if (delta >= 0) {
                let x1 = (-b + Math.sqrt(delta)) / (2 * a);
                let x2 = (-b - Math.sqrt(delta)) / (2 * a);

                // 2. Arredondar para duas casas decimais
                x1 = x1.toFixed(2);
                x2 = x2.toFixed(2);

                alert("x1 = " + x1 + " e x2 = " + x2);
            } else {
                alert("Não existem raízes reais.");
            }
        }

        // 3. Perguntar se pretende repetir
        repetir = prompt("Pretende executar novamente? (sim/não)");

    } while (repetir.toLowerCase() === "sim");

    alert("Programa terminado!");

</script>

</body>
</html>
